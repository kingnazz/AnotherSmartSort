[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-pdf-sorter"
# The version lives in app/version.py and is read from there. Do not add a
# literal version here -- see app/version.py for the single source of truth.
dynamic = ["version"]
description = "Understand combined PDFs, group pages into logical documents, review only the uncertain decisions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Smart PDF Sorter" }]
dependencies = [
    "PySide6>=6.6,<7",
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    "requests>=2.31",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pyinstaller>=6.6"]

[project.gui-scripts]
smart-pdf-sorter = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = { attr = "app.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "gui: tests that construct Qt widgets (require a Qt platform plugin)",
    "ocr_real: tests that run a real Tesseract binary (slower; skipped if absent)",
    "benchmark: long-running performance benchmarks (never run by default)",
]
