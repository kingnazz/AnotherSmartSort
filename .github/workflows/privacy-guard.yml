name: Confidential QA file guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  privacy:
    name: Reject tracked QA data
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Verify confidential QA files are not tracked
        run: python scripts/check_private_qa.py
