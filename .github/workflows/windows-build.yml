name: Windows production build

# A push to a branch that has an open pull request used to fire this whole
# pipeline twice -- once for the push, once for the pull_request -- because
# the two events carry different refs, so the concurrency group below cannot
# collapse them. Nothing cancelled anything; both ran the full ~48-minute
# Windows build, at the 2x Windows minute multiplier, for one commit.
#
# Now a branch is covered by its pull request and the default branch by its
# push, so every commit gets exactly one run. A branch with no pull request
# open gets none, which is what workflow_dispatch is for.
on:
  push:
    branches: ["main"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  PYTHONUTF8: 1

jobs:
  # The production gate: build the real deliverables, install them on a clean
  # Windows runner, prove the installed application works, then uninstall.
  windows:
    name: Build, install and verify on Windows
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Read the application version
        id: version
        shell: pwsh
        run: |
          $version = (python -m app.version).Trim()
          if (-not $version) { throw "Could not read the version from app/version.py" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install the WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Add the WiX UI extension
        shell: pwsh
        run: wix extension add --global WixToolset.UI.wixext/5.0.2

      # ------------------------------------------------------------------
      # Cache the pinned OCR installer: it is ~48 MB and never changes for a
      # given pin, so re-downloading it on every run is pure waste.
      # ------------------------------------------------------------------
      - name: Cache the OCR runtime download
        uses: actions/cache@v4
        with:
          path: build/ocr-cache
          key: ocr-runtime-${{ hashFiles('scripts/fetch_ocr_runtime.py') }}

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Stage the bundled OCR runtime
        run: python scripts/fetch_ocr_runtime.py --output ocr

      - name: Verify the staged OCR runtime
        shell: pwsh
        run: |
          if (-not (Test-Path "ocr\tesseract.exe")) { throw "ocr\tesseract.exe is missing" }
          if (-not (Test-Path "ocr\tessdata\eng.traineddata")) { throw "English trained data is missing" }
          & "ocr\tesseract.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "The bundled tesseract.exe does not run on this machine" }

          # --list-langs is what the app itself calls to decide whether a
          # requested language is usable, so prove it works here rather than
          # discovering on a client machine that it returns nothing.
          $langs = & "ocr\tesseract.exe" --list-langs 2>&1 | Out-String
          Write-Host $langs
          if ($LASTEXITCODE -ne 0) { throw "--list-langs failed" }
          if ($langs -notmatch "(?m)^\s*eng\s*$") { throw "English is not among the bundled languages" }

      # The real OCR integration tests need the bundled runtime in place, so
      # they run only after it has been staged. -s keeps their measured
      # counters (native_text_pages / ocr_pages / ocr_failures) in the log,
      # which is the only record of what the packaged runtime actually did.
      - name: Run the real OCR integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m ocr_real -v -s

      # ------------------------------------------------------------------
      # Build both application flavours
      # ------------------------------------------------------------------
      - name: Build the installed application (onedir)
        run: python -m PyInstaller SmartPDFSorter.spec --noconfirm --clean

      - name: Stage OCR and notices beside the installed executable
        shell: pwsh
        run: |
          Copy-Item ocr "dist\SmartPDFSorter\ocr" -Recurse -Force
          Copy-Item THIRD_PARTY_NOTICES.md "dist\SmartPDFSorter\" -Force

      - name: Build the portable application (onefile)
        run: python -m PyInstaller SmartPDFSorter-Portable.spec --noconfirm --clean

      # NOTE: these executables are GUI-subsystem, so PowerShell does not wait
      # for them. Invoke-AppCli.ps1 starts them, waits, and returns the real
      # exit code -- calling them with & would check a stale $LASTEXITCODE.
      - name: Verify the built applications before packaging
        shell: pwsh
        run: |
          $exe = "dist\SmartPDFSorter\SmartPDFSorter.exe"
          if (-not (Test-Path $exe)) { throw "The installed build is missing" }

          $reported = (.\scripts\Invoke-AppCli.ps1 -Exe $exe -AppArgs '--version' -PassOutput | Out-String).Trim()
          Write-Host "Installed build reports: $reported"
          if ($LASTEXITCODE -ne 0) { throw "--version returned $LASTEXITCODE" }
          if ($reported -notmatch [regex]::Escape("${{ steps.version.outputs.version }}")) {
            throw "Version mismatch: '$reported'"
          }

          .\scripts\Invoke-AppCli.ps1 -Exe $exe -AppArgs '--smoke-test'
          if ($LASTEXITCODE -ne 0) { throw "The installed build failed its smoke test" }

          $ocr = (.\scripts\Invoke-AppCli.ps1 -Exe $exe -AppArgs '--ocr-info' -PassOutput | Out-String)
          Write-Host $ocr
          if ($ocr -notmatch "bundled") { throw "The build did not resolve its bundled OCR runtime" }

          .\scripts\Invoke-AppCli.ps1 -Exe "dist\SmartPDFSorter-Portable.exe" -AppArgs '--smoke-test'
          if ($LASTEXITCODE -ne 0) { throw "The portable build failed its smoke test" }

          # A windowed executable has no console of its own, so without
          # AttachConsole this prints nowhere and someone typing --version into
          # PowerShell sees silence. Prove the output reaches an inherited
          # console rather than only a redirected file handle.
          Write-Host "== Console output when run directly =="
          $direct = & cmd /c "`"$exe`" --version 2>&1"
          Write-Host "cmd saw: '$direct'"
          if ($direct -notmatch [regex]::Escape("${{ steps.version.outputs.version }}")) {
            throw "Running --version from a console produced no visible output"
          }

      # ------------------------------------------------------------------
      # Build the MSI
      # ------------------------------------------------------------------
      - name: Build the MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $version = "${{ steps.version.outputs.version }}"
          wix build installer\Package.wxs `
            -arch x64 `
            -d "Version=$version" `
            -d "HarvestPath=$PWD\dist\SmartPDFSorter" `
            -d "RepoRoot=$PWD" `
            -ext WixToolset.UI.wixext `
            -o "artifacts\SmartPDFSorter-Setup-$version.msi"
          if ($LASTEXITCODE -ne 0) { throw "WiX failed to build the MSI" }

      - name: Verify the MSI metadata
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $msi = "artifacts\SmartPDFSorter-Setup-$version.msi"
          if (-not (Test-Path $msi)) { throw "The MSI was not produced" }

          $sizeMb = [Math]::Round((Get-Item $msi).Length / 1MB, 1)
          Write-Host "MSI size: $sizeMb MB"
          if ($sizeMb -lt 20) { throw "The MSI is implausibly small ($sizeMb MB)" }

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember("OpenDatabase", "InvokeMethod", $null, $installer, @($msi, 0))
          function Get-MsiProperty($db, $name) {
            $view = $db.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $db,
              @("SELECT Value FROM Property WHERE Property = '$name'"))
            $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null) | Out-Null
            $rec = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
            if ($null -eq $rec) { return $null }
            return $rec.GetType().InvokeMember("StringData", "GetProperty", $null, $rec, 1)
          }
          $productVersion = Get-MsiProperty $db "ProductVersion"
          $productName    = Get-MsiProperty $db "ProductName"
          $upgradeCode    = Get-MsiProperty $db "UpgradeCode"
          Write-Host "ProductName    : $productName"
          Write-Host "ProductVersion : $productVersion"
          Write-Host "UpgradeCode    : $upgradeCode"

          if ($productVersion -ne $version) { throw "ProductVersion is '$productVersion', expected '$version'" }
          if ($productName -ne "AS Resume Sorter") { throw "Unexpected ProductName '$productName'" }
          if ($upgradeCode -ne "{7B3F2E64-9A21-4C0D-9E2B-5F1A6D8C4E30}") {
            throw "UpgradeCode changed to '$upgradeCode' - this would break upgrades from released versions"
          }

      # ------------------------------------------------------------------
      # Installer smoke test: install silently, prove it works, uninstall.
      # ------------------------------------------------------------------
      - name: Install the MSI silently
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $msi = (Resolve-Path "artifacts\SmartPDFSorter-Setup-$version.msi").Path
          $log = "$PWD\msi-install.log"
          $p = Start-Process msiexec.exe -ArgumentList @(
            "/i", "`"$msi`"", "/qn", "/norestart", "/l*v", "`"$log`""
          ) -Wait -PassThru
          Write-Host "msiexec exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Get-Content $log -Tail 60
            throw "Silent install failed with exit code $($p.ExitCode)"
          }

      - name: Verify the installed application
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installDir = "$env:ProgramFiles\AS Resume Sorter"
          $exe = Join-Path $installDir "SmartPDFSorter.exe"

          Write-Host "== Installed files =="
          if (-not (Test-Path $exe)) { throw "The application executable was not installed" }
          if (-not (Test-Path (Join-Path $installDir "_internal"))) { throw "_internal was not installed" }
          if (-not (Test-Path (Join-Path $installDir "ocr\tesseract.exe"))) { throw "The bundled OCR engine was not installed" }
          if (-not (Test-Path (Join-Path $installDir "ocr\tessdata\eng.traineddata"))) { throw "English OCR data was not installed" }
          Write-Host "OK: application, runtime and OCR are present"

          Write-Host "== Installed version =="
          $reported = (.\scripts\Invoke-AppCli.ps1 -Exe $exe -AppArgs '--version' -PassOutput | Out-String).Trim()
          Write-Host $reported
          if ($LASTEXITCODE -ne 0) { throw "--version returned $LASTEXITCODE" }
          if ($reported -notmatch [regex]::Escape($version)) { throw "Installed version mismatch: '$reported'" }

          Write-Host "== Smoke test of the INSTALLED application =="
          .\scripts\Invoke-AppCli.ps1 -Exe $exe -AppArgs '--smoke-test'
          if ($LASTEXITCODE -ne 0) { throw "The installed application failed its smoke test" }

          Write-Host "== OCR after installation =="
          $ocr = (.\scripts\Invoke-AppCli.ps1 -Exe $exe -AppArgs '--ocr-info' -PassOutput | Out-String)
          Write-Host $ocr
          if ($ocr -notmatch "bundled") {
            throw "The installed application did not resolve its bundled OCR engine"
          }

          Write-Host "== Installed footprint =="
          $installedMb = [Math]::Round(
            ((Get-ChildItem $installDir -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB), 1)
          Write-Host "  $installDir occupies $installedMb MB on disk"

          Write-Host "== File version metadata =="
          $fileVersion = (Get-Item $exe).VersionInfo
          Write-Host "  ProductName: $($fileVersion.ProductName)"
          Write-Host "  FileVersion: $($fileVersion.FileVersion)"
          if ($fileVersion.ProductName -ne "AS Resume Sorter") { throw "Missing product metadata on the EXE" }

      - name: Verify Windows registration and the Start Menu shortcut
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          Write-Host "== Programs and Features registration =="
          $keys = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty $keys -ErrorAction SilentlyContinue |
                   Where-Object { $_.DisplayName -eq "AS Resume Sorter" } |
                   Select-Object -First 1
          if (-not $entry) { throw "AS Resume Sorter is not registered in Programs and Features" }
          Write-Host "  DisplayName    : $($entry.DisplayName)"
          Write-Host "  DisplayVersion : $($entry.DisplayVersion)"
          Write-Host "  Publisher      : $($entry.Publisher)"
          if ($entry.DisplayVersion -ne $version) {
            throw "Registered version is '$($entry.DisplayVersion)', expected '$version'"
          }
          if (-not $entry.Publisher) { throw "No publisher recorded in Programs and Features" }

          Write-Host "== Start Menu shortcut =="
          $shortcut = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\AS Resume Sorter\AS Resume Sorter.lnk"
          if (-not (Test-Path $shortcut)) {
            Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "*.lnk" |
              Select-Object -ExpandProperty FullName | Write-Host
            throw "The Start Menu shortcut was not created"
          }
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut($shortcut)
          Write-Host "  Target: $($link.TargetPath)"
          if (-not (Test-Path $link.TargetPath)) { throw "The Start Menu shortcut points at a missing file" }

          Write-Host "== Desktop shortcut should NOT exist by default =="
          $desktop = "$env:PUBLIC\Desktop\AS Resume Sorter.lnk"
          if (Test-Path $desktop) { throw "A desktop shortcut was created without being requested" }

      - name: Verify user data lives outside Program Files
        shell: pwsh
        run: |
          $installDir = "$env:ProgramFiles\AS Resume Sorter"
          # The smoke test above already ran the app, so its data directory exists.
          $dataDir = "$env:LOCALAPPDATA\SmartPDFSorter"
          if (-not (Test-Path $dataDir)) { throw "User data directory was not created at $dataDir" }
          Write-Host "User data: $dataDir"
          Get-ChildItem $dataDir | Select-Object -ExpandProperty Name | Write-Host

          $strays = Get-ChildItem $installDir -Recurse -Include "settings.json", "history.sqlite3" -ErrorAction SilentlyContinue
          if ($strays) {
            $strays | Select-Object -ExpandProperty FullName | Write-Host
            throw "Mutable user data was written under Program Files"
          }

      - name: Uninstall the MSI silently
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $msi = (Resolve-Path "artifacts\SmartPDFSorter-Setup-$version.msi").Path
          $log = "$PWD\msi-uninstall.log"
          $p = Start-Process msiexec.exe -ArgumentList @(
            "/x", "`"$msi`"", "/qn", "/norestart", "/l*v", "`"$log`""
          ) -Wait -PassThru
          Write-Host "msiexec exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Get-Content $log -Tail 60
            throw "Silent uninstall failed with exit code $($p.ExitCode)"
          }

      - name: Verify the uninstall removed everything
        shell: pwsh
        run: |
          $installDir = "$env:ProgramFiles\AS Resume Sorter"
          $exe = Join-Path $installDir "SmartPDFSorter.exe"
          if (Test-Path $exe) { throw "The application executable survived uninstall" }
          Write-Host "OK: application binaries removed"

          $shortcut = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\AS Resume Sorter\AS Resume Sorter.lnk"
          if (Test-Path $shortcut) { throw "The Start Menu shortcut survived uninstall" }
          Write-Host "OK: Start Menu shortcut removed"

          $entry = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                   Where-Object { $_.DisplayName -eq "AS Resume Sorter" }
          if ($entry) { throw "AS Resume Sorter is still registered in Programs and Features" }
          Write-Host "OK: Programs and Features entry removed"

          # User data must be left alone: uninstalling an application should not
          # destroy the user's settings and processing history.
          if (-not (Test-Path "$env:LOCALAPPDATA\SmartPDFSorter")) {
            throw "Uninstall deleted the user's data directory"
          }
          Write-Host "OK: user settings and history preserved"

      # ------------------------------------------------------------------
      # Upgrade check: install, then install again over the top.
      # ------------------------------------------------------------------
      - name: Verify an in-place upgrade keeps user data
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $msi = (Resolve-Path "artifacts\SmartPDFSorter-Setup-$version.msi").Path
          $dataDir = "$env:LOCALAPPDATA\SmartPDFSorter"

          function Install-Msi($arguments) {
            $p = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec failed: $($p.ExitCode)" }
          }

          Install-Msi @("/i", "`"$msi`"", "/qn", "/norestart")

          # Leave a marker in the user's data so we can prove it survives.
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          "upgrade-marker" | Set-Content "$dataDir\upgrade-marker.txt"

          # Reinstall the same version over the top: AllowSameVersionUpgrades
          # must replace it in place rather than leaving two installations.
          Install-Msi @("/i", "`"$msi`"", "/qn", "/norestart")

          $entries = @(Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                       Where-Object { $_.DisplayName -eq "AS Resume Sorter" })
          Write-Host "Programs and Features entries after re-install: $($entries.Count)"
          if ($entries.Count -ne 1) { throw "Expected exactly one installation, found $($entries.Count)" }

          if (-not (Test-Path "$dataDir\upgrade-marker.txt")) {
            throw "The upgrade destroyed the user's data"
          }
          Write-Host "OK: upgrade replaced the install in place and preserved user data"

          .\scripts\Invoke-AppCli.ps1 -Exe "$env:ProgramFiles\AS Resume Sorter\SmartPDFSorter.exe" -AppArgs '--smoke-test'
          if ($LASTEXITCODE -ne 0) { throw "The upgraded installation failed its smoke test" }

          Install-Msi @("/x", "`"$msi`"", "/qn", "/norestart")
          Write-Host "OK: cleaned up"

      # ------------------------------------------------------------------
      # Publish
      # ------------------------------------------------------------------
      - name: Collect artifacts and write checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Copy-Item "dist\SmartPDFSorter-Portable.exe" "artifacts\SmartPDFSorter-Portable-$version.exe" -Force

          # WiX writes a .wixpdb debug symbol file next to the MSI. It is a
          # build artefact, not a deliverable, so it is not shipped or hashed.
          Remove-Item artifacts\*.wixpdb -Force -ErrorAction SilentlyContinue

          $lines = @()
          Get-ChildItem artifacts -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              $lines += "$hash  $($_.Name)"
              Write-Host "$($_.Name)  $([Math]::Round($_.Length / 1MB, 1)) MB"
            }
          $lines -join "`n" | Set-Content "artifacts\SHA256SUMS.txt" -Encoding ascii
          Get-Content "artifacts\SHA256SUMS.txt"

      # Keeping the build is a separate question from proving it. Every run
      # above already built the MSI, installed it silently, upgraded it in
      # place and uninstalled it -- that is the verification, and it happens
      # whether or not anybody keeps a copy. Retaining ~170 MB per run of every
      # branch is what exhausted the account's artifact storage, which blocks
      # Actions outright: no runner is allocated, jobs fail in seconds with no
      # logs, and the cleanup workflow meant to rescue the situation cannot run
      # either, because it is itself an Action.
      #
      # So a copy is kept only where somebody would actually download one: the
      # default branch, a release tag, or a run a human asked for by hand.
      # To get an installer from a feature branch, trigger this workflow from
      # the Actions tab against that branch.
      - name: Upload the production artifacts
        if: >-
          github.ref == 'refs/heads/main'
          || startsWith(github.ref, 'refs/tags/')
          || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDFSorter-${{ steps.version.outputs.version }}-windows
          path: |
            artifacts/SmartPDFSorter-Setup-*.msi
            artifacts/SmartPDFSorter-Portable-*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload the installer logs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-logs-${{ github.run_id }}
          path: |
            msi-install.log
            msi-uninstall.log
          if-no-files-found: ignore
          retention-days: 7

  # Cross-platform regression check. Cheap, and it catches path and encoding
  # mistakes that a Windows-only pipeline would miss.
  linux-tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Qt runtime libraries and Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xkb1 libxrender1 tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Run the real OCR integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m ocr_real -v

      - name: Verify the command-line entry points
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m app.main --version
          python -m app.main --ocr-info
          python -m app.main --smoke-test
